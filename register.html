<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register | NexiRocket-XAU Pro Max</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0e17; color: #f8fafc; min-height: 100vh; }

        .navbar {
            background: #111827;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #d4af37;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #d4af37;
            text-decoration: none;
        }
        .logo span { color: #fff; }
        .nav-buttons { display: flex; gap: 12px; }
        .btn-outline {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            padding: 8px 22px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-outline:hover { background: #d4af37; color: #111827; }

        .container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .form-card {
            background: #111827;
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .form-card h2 {
            color: #d4af37;
            font-size: 1.8rem;
            margin-bottom: 10px;
            text-align: center;
        }
        .form-card .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus { border-color: #d4af37; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #f0d060);
            color: #111827;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.9rem;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            display: block;
        }
        .message.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
            display: block;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .login-link a {
            color: #d4af37;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .form-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🚀 Nexi<span>Rocket-XAU</span></a>
        <div class="nav-buttons">
            <a href="signin.html" class="btn-outline">Sign In</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2>Create Account</h2>
            <p class="subtitle">Join NexiRocket-XAU today</p>

            <div class="message" id="messageBox"></div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required />
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="email" placeholder="your@email.com" required />
                </div>

                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" placeholder="+92 3XX XXXXXXX" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="password" placeholder="Min 6 chars" minlength="6" required />
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter" minlength="6" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>Starting Capital ($) *</label>
                    <input type="number" id="startingCapital" placeholder="Min $100" min="100" value="100" required />
                </div>

                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="terms" required style="width: auto;" />
                        <span style="color: #cbd5e1; font-size: 0.85rem;">I agree to Terms & Conditions</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Register Now
                </button>

                <div class="login-link">
                    Already have an account? <a href="signin.html">Sign In</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ================================================================
        //  REGISTER HANDLER - FIXED
        // ================================================================
        function handleRegister(event) {
            event.preventDefault();
            
            const messageBox = document.getElementById('messageBox');
            
            // Get values
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const startingCapital = parseFloat(document.getElementById('startingCapital').value);

            // Validation
            if (password !== confirmPassword) {
                showMessage('❌ Passwords do not match!', 'error');
                return;
            }

            if (startingCapital < 100) {
                showMessage('❌ Minimum starting capital is $100', 'error');
                return;
            }

            // Get existing users
            const users = JSON.parse(localStorage.getItem('nexiUsers') || '[]');
            
            // Check if user already exists
            const existingUser = users.find(u => u.email === email || u.phone === phone);
            
            if (existingUser) {
                showMessage('❌ User with this email or phone already exists! Please Sign In.', 'error');
                return;
            }

            // Generate secret key
            const emailPart = email.substring(0, 4).toUpperCase();
            const phonePart = phone.slice(-4);
            const random = Math.floor(1000 + Math.random() * 9000);
            const secretKey = `${emailPart}${phonePart}${random}`;

            // Subscription dates
            const today = new Date();
            const expiry = new Date();
            expiry.setMonth(expiry.getMonth() + 1);

            // Create user object
            const newUser = {
                id: 'user_' + Date.now(),
                fullName: fullName,
                email: email,
                phone: phone,
                password: password,
                startingCapital: startingCapital,
                secretKey: secretKey,
                subscriptionStart: today.toISOString().split('T')[0],
                subscriptionEnd: expiry.toISOString().split('T')[0],
                status: 'active',
                createdAt: new Date().toISOString()
            };

            // Save to localStorage
            users.push(newUser);
            localStorage.setItem('nexiUsers', JSON.stringify(users));

            // Show success
            showMessage('✅ Registration successful!<br>Your Secret Key: <strong style="color:#d4af37;">' + secretKey + '</strong><br>Redirecting to Sign In...', 'success');

            // Auto redirect after 3 seconds
            setTimeout(() => {
                window.location.href = 'signin.html';
            }, 3000);
        }

        function showMessage(text, type) {
            const box = document.getElementById('messageBox');
            box.className = 'message ' + type;
            box.innerHTML = text;
            box.style.display = 'block';
        }

        // ================================================================
        //  DEBUG: Clear all users (temporary - remove in production)
        // ================================================================
        window.clearAllUsers = function() {
            if (confirm('Clear all registered users? (Debug only)')) {
                localStorage.removeItem('nexiUsers');
                localStorage.removeItem('nexiCurrentUser');
                alert('✅ All users cleared!');
            }
        };
    </script>
</body>
</html>
