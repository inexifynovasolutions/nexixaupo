<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign In | NexiRocket-XAU Pro Max</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0e17; color: #f8fafc; min-height: 100vh; }
        .navbar { background: #111827; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #d4af37; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; font-weight: 900; color: #d4af37; text-decoration: none; }
        .logo span { color: #fff; }
        .btn-outline { background: transparent; border: 2px solid #d4af37; color: #d4af37; padding: 8px 22px; border-radius: 8px; font-weight: 700; cursor: pointer; text-decoration: none; }
        .btn-outline:hover { background: #d4af37; color: #111827; }
        .container { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 70px); padding: 40px 20px; }
        .form-card { background: #111827; border: 2px solid #334155; border-radius: 20px; padding: 40px; max-width: 450px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .form-card h2 { color: #d4af37; font-size: 2rem; margin-bottom: 10px; text-align: center; }
        .form-card .subtitle { color: #94a3b8; text-align: center; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #94a3b8; font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 18px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: #d4af37; }
        .btn-submit { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37, #f0d060); color: #111827; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); }
        .message { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; font-size: 0.9rem; }
        .message.error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; display: block; }
        .message.warning { background: rgba(251, 191, 36, 0.1); border: 1px solid #fbbf24; color: #fbbf24; display: block; }
        .message.success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; display: block; }
        .register-link { text-align: center; margin-top: 20px; color: #94a3b8; font-size: 0.9rem; }
        .register-link a { color: #d4af37; text-decoration: none; font-weight: 700; }
        .debug-info { text-align: center; margin-top: 20px; padding: 10px; background: #1e293b; border-radius: 8px; font-size: 0.75rem; color: #64748b; }
        .debug-info button { background: #334155; color: #fff; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">🚀 Nexi<span>Rocket-XAU</span></a>
        <a href="register.html" class="btn-outline">Register</a>
    </nav>

    <div class="container">
        <div class="form-card">
            <h2>Sign In</h2>
            <p class="subtitle">Welcome back!</p>
            <div class="message" id="messageBox"></div>
            <form onsubmit="handleSignIn(event)" id="signinForm">
                <div class="form-group">
                    <label>Email or Phone</label>
                    <input type="text" id="loginInput" placeholder="Enter email or phone" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required />
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="register-link">
                    Don't have an account? <a href="register.html">Register</a>
                </div>
            </form>
            <div class="debug-info">
                <span id="userCount">Registered Users: 0</span>
                <button onclick="clearAllUsers()" style="margin-left: 10px;">Clear All</button>
            </div>
        </div>
    </div>

    <script>
        function handleSignIn(event) {
            event.preventDefault();
            const input = document.getElementById('loginInput').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const messageBox = document.getElementById('messageBox');

            const users = JSON.parse(localStorage.getItem('nexiUsers') || '[]');

            if (users.length === 0) {
                messageBox.className = 'message error';
                messageBox.innerHTML = '❌ No users registered yet!<br>Please <a href="register.html" style="color:#d4af37;">Register first</a>.';
                return;
            }

            const user = users.find(u => (u.email === input || u.phone === input) && u.password === password);

            if (!user) {
                messageBox.className = 'message error';
                messageBox.innerText = '❌ Invalid credentials! Please check and try again.';
                return;
            }

            // Save user session FIRST
            localStorage.setItem('nexiCurrentUser', JSON.stringify(user));

            // Check subscription expiry
            const today = new Date().toISOString().split('T')[0];

            if (user.subscriptionEnd < today) {
                messageBox.className = 'message warning';
                messageBox.innerHTML = '⚠️ Your subscription has expired!<br>Redirecting to renewal page...';
                setTimeout(() => {
                    window.location.replace('renewal.html');
                }, 2000);
                return;
            }

            messageBox.className = 'message success';
            messageBox.innerHTML = '✅ Login successful!<br>Welcome back, ' + user.fullName + '!';
            setTimeout(() => {
                window.location.replace('dashboard.html');
            }, 1500);
        }

        // ✅ ENTER key support — dono fields mein
        document.getElementById('loginInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const pwd = document.getElementById('loginPassword');
                if (pwd.value.trim() === '') {
                    pwd.focus();
                } else {
                    document.getElementById('signinForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                }
            }
        });

        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('signinForm').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        });

        window.addEventListener('load', () => {
            const users = JSON.parse(localStorage.getItem('nexiUsers') || '[]');
            document.getElementById('userCount').innerText = 'Registered Users: ' + users.length;
        });

        function clearAllUsers() {
            if (confirm('Clear all registered users? (Debug only)')) {
                localStorage.removeItem('nexiUsers');
                localStorage.removeItem('nexiCurrentUser');
                localStorage.removeItem('nexiPendingPayments');
                document.getElementById('userCount').innerText = 'Registered Users: 0';
                alert('✅ All users cleared!');
            }
        }
    </script>
</body>
</html>
