<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - nexiXAUPO</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">🚀 nexiXAUPO</a>
            <div class="nav-links">
                <a href="register.html" class="active">Register</a>
                <a href="signin.html">Sign In</a>
            </div>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-container">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Register to get started</p>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" required />
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required />
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm password" required />
                </div>

                <div class="form-group">
                    <label>Binance UID</label>
                    <input type="text" id="binanceUid" placeholder="Enter your Binance UID" required />
                </div>

                <div class="form-group">
                    <label>Binance Nickname</label>
                    <input type="text" id="binanceNickname" placeholder="Enter your Binance nickname" />
                </div>

                <div class="form-group">
                    <label>Screenshot (Transfer Proof)</label>
                    <input type="file" id="screenshot" accept="image/*" required />
                </div>

                <div id="message" class="message"></div>

                <button type="submit" class="btn btn-primary btn-block">Register</button>

                <p class="auth-link">
                    Already have an account? <a href="signin.html">Sign In</a>
                </p>
            </form>
        </div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
