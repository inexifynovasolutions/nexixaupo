<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Test Auth | Nexi Rocket-XauPo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #0a0e17; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #111827; border: 2px solid #d4af37; border-radius: 20px; padding: 35px; max-width: 500px; width: 100%; }
        .card h1 { color: #d4af37; font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
        .card p { color: #94a3b8; font-size: 0.85rem; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; color: #cbd5e1; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; background: #1e293b; border: 2px solid #334155; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; }
        .form-group input:focus { border-color: #d4af37; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #d4af37, #f0d060); color: #111827; }
        .btn-green { background: #10b981; color: #fff; }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-blue { background: #60a5fa; color: #fff; }
        .result { background: #0f1729; border: 1px solid #334155; border-radius: 10px; padding: 15px; margin-top: 20px; font-size: 0.8rem; color: #cbd5e1; max-height: 300px; overflow-y: auto; font-family: monospace; }
        .result .success { color: #10b981; }
        .result .error { color: #ef4444; }
        .result .info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🧪 Supabase Auth Test</h1>
        <p>Sirf testing — asli site ko touch nahi karta</p>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="testEmail" placeholder="test@example.com" />
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="testPassword" placeholder="Min 6 chars" minlength="6" />
        </div>

        <button class="btn btn-primary" onclick="testSignUp()">📝 Sign Up</button>
        <button class="btn btn-green" onclick="testSignIn()">🔐 Sign In</button>
        <button class="btn btn-blue" onclick="checkSession()">👤 Check Session</button>
        <button class="btn btn-red" onclick="testSignOut()">🚪 Sign Out</button>

        <div class="result" id="result">Waiting...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://awiduhclxuxkqkxrgfub.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_D44mLJQb87KSHfN_9lQTHg_hvAzRavv';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const resultEl = document.getElementById('result');

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const cls = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            resultEl.innerHTML += `<div class="${cls}">[${time}] ${msg}</div>`;
            resultEl.scrollTop = resultEl.scrollHeight;
        }

        function clearLog() { resultEl.innerHTML = ''; }

        async function testSignUp() {
            const email = document.getElementById('testEmail').value.trim();
            const password = document.getElementById('testPassword').value;
            if (!email || !password) { log('❌ Email aur password chahiye', 'error'); return; }
            clearLog();
            log('📝 Signing up: ' + email);
            try {
                const { data, error } = await sb.auth.signUp({ email, password });
                if (error) throw error;
                log('✅ Sign Up SUCCESS!', 'success');
                log('User ID: ' + (data.user?.id || 'N/A'));
                log('Session: ' + (data.session ? 'Active (auto-logged in)' : 'None — email confirm ON?'));
            } catch (err) {
                log('❌ Sign Up FAILED: ' + err.message, 'error');
            }
        }

        async function testSignIn() {
            const email = document.getElementById('testEmail').value.trim();
            const password = document.getElementById('testPassword').value;
            if (!email || !password) { log('❌ Email aur password chahiye', 'error'); return; }
            clearLog();
            log('🔐 Signing in: ' + email);
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                log('✅ Sign In SUCCESS!', 'success');
                log('User ID: ' + data.user.id);
                log('Email: ' + data.user.email);
            } catch (err) {
                log('❌ Sign In FAILED: ' + err.message, 'error');
            }
        }

        async function checkSession() {
            clearLog();
            log('👤 Checking session...');
            try {
                const { data, error } = await sb.auth.getSession();
                if (error) throw error;
                if (data.session) {
                    log('✅ Session ACTIVE', 'success');
                    log('User: ' + data.session.user.email);
                } else {
                    log('❌ No active session', 'error');
                }
            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
            }
        }

        async function testSignOut() {
            clearLog();
            log('🚪 Signing out...');
            try {
                const { error } = await sb.auth.signOut();
                if (error) throw error;
                log('✅ Signed out!', 'success');
            } catch (err) {
                log('❌ Error: ' + err.message, 'error');
            }
        }

        window.addEventListener('load', () => {
            log('✅ Test page loaded');
        });
    </script>
</body>
</html>
